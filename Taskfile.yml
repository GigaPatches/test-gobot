version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the gobot binary into ./bin
    cmds:
      - go build -o bin/gobot .
    sources:
      - "**/*.go"
    generates:
      - bin/gobot

  run:
    desc: Run the chatbot REPL
    cmds:
      - go run .

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  cover:
    desc: Run tests with coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  check:
    desc: Run fmt check, vet, and tests
    cmds:
      - test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }
      - go vet ./...
      - go test ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin coverage.out
